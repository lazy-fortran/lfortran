name: Cleanup caches by a branch

# pull_request_target gets a token that can delete caches for PRs from forks
# (pull_request only gets a read-only token there). This workflow must never
# check out or run PR code; it only uses the PR number.
on:
  pull_request_target:
    types:
      - closed

  merge_group:
  push:
    branches:
      - main

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]') || (github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    steps:
      - name: Delete the PR's caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: gh cache delete --all --ref "$REF" --succeed-on-no-caches
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}
